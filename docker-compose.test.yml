name: nexa-tests

services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nexa_dashboard_test
      POSTGRES_USER: nexa_test
      POSTGRES_PASSWORD: nexa_test_only
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - nexa-postgres-test:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexa_test -d nexa_dashboard_test']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  nexa-postgres-test:
